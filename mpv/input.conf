# --- EFFETS VIDÉO (ON / OFF) ---
# Appuie sur la touche pour activer, ré-appuie pour désactiver

# Touche 'g' : Effet Vague de fluide / Distorsion d'eau
g vf toggle "lavfi=[wave=m=20:s=2]"

# Touche 'h' : Effet Miroir (Inversion horizontale)
h vf toggle "hflip"

# Touche 'j' : Effet Négatif / Inversion des couleurs
j vf toggle "negate"

# Touche 'k' : Effet Pixel Art / Rétro 8-bit
k vf toggle "lavfi=[pixelize=p_w=8:p_h=8]"

# Touche 'l' : Effet Noir et Blanc (Grayscale)
l vf toggle "format=gray"

# Touche 'CTRL+g' : Désactiver TOUS les effets actifs d'un coup
CTRL+g vf clr ""

