# --- ACCÉLÉRATION MATÉRIELLE DIRECTE (Sans glitchs) ---
# 'vaapi' décode directement dans la carte graphique pour une image parfaite
hwdec=vaapi
hwdec-codecs=all

# --- RENDU ET COMPATIBILITÉ WAYLAND ---
vo=gpu

# --- FORMAT YOUTUBE (H.264 / AVC1 max 720p) ---
ytdl-format="bestvideo[vcodec^=avc1][height<=720]+bestaudio/best[vcodec^=avc1]/best"

# --- ALLÈGEMENT EXTRÊME DE LA CHARGE (Profil "Fast") ---
profile=fast
scale=bilinear
cscale=bilinear
dither-depth=no
sigmoid-upscaling=no
correct-downscaling=no

# --- FLUIDITÉ & AUDIO (Anti-décalage) ---
video-sync=audio
audio-buffer=0.5
framedrop=vo

# --- LANGUES DÉFAUT ---
alang=fra,fr,eng,en
slang=fra,fr,eng,en

# --- REPRISE DE LECTURE AUTOMATIQUE ---
save-position-on-quit=yes

